<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha Baldurs Gate 3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="formulario">
            <h3>NOVO PERSONAGEM</h3>

            <div class="campo nome">
                <span>NOME</span>
                <input type="text">
            </div>

            <div class="linha">

                <div class="campo">
                    <span>CLASSE</span>
                    <select name="" id="">
                        <option value="#" selected disabled>Selecione...</option>
                        <option value="">Bárbaro</option>
                        <option value="">Bardo</option>
                        <option value="">Clérigo</option>
                        <option value="">Druida</option>
                        <option value="">Feiticeiro</option>
                        <option value="">Guerreiro</option>
                        <option value="">Ladino</option>
                        <option value="">Mago</option>
                        <option value="">Monge</option>
                        <option value="">Paladino</option>
                        <option value="">Patrulheiro</option>
                        <option value="">Bruxo</option>
                    </select>
                </div>

                <div class="campo">
                    <span>RAÇA</span>
                    <select name="" id="">
                        <option value="#" selected disabled>Selecione...</option>
                        <option value="">Humano</option>
                        <option value="">Elfo</option>
                        <option value="">Meio-Elfo</option>
                        <option value="">Tiefling</option>
                        <option value="">Anão</option>
                        <option value="">Halfling</option>
                        <option value="">Gnomo</option>
                        <option value="">Meio-Orc</option>
                        <option value="">Githyanki</option>
                        <option value="">Drow</option>
                    </select>
                </div>

            </div>

            <div class="linha">
                <div class="campo">
                    <span>NÍVEL</span>
                    <input type="number">
                </div>

                <div class="campo">
                <span>DATA DE CRIAÇÃO</span>
                <input type="date">
                </div>
            </div>

            <div class="campo">
                <span>PARTY</span>
                <div class="checklist">
                    <input type="checkbox" value="Umbralma">
                    <span>Umbralma</span>
                </div>

                <div class="checklist">
                    <input type="checkbox" value="Astarion">
                    <span>Astarion</span>
                </div>

                <div class="checklist">
                    <input type="checkbox" value="Gale">
                    <span>Gale</span>
                </div>

                <div class="checklist">
                    <input type="checkbox" value="Lae'Zel">
                    <span>Lae'Zel</span>
                </div>

                <div class="checklist">
                    <input type="checkbox" value="Wyll">
                    <span>Wyll</span>
                </div>

                <div class="checklist">
                    <input type="checkbox" value="Karlach">
                    <span>Karlach</span>
                </div>

                <div class="checklist">
                    <input type="checkbox" value="Halsin">
                    <span>Halsin</span>
                </div>

                <div class="checklist">
                    <input type="checkbox" value="Minthara">
                    <span>Minthara</span>
                </div>
            </div>

            <div class="linha">
                <button>CANCELAR</button>

                <button>CRIAR PERSONAGEM</button>
            </div>
        </div>
    </main>
</body>
</html>
